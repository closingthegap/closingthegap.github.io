name: Schema validation with Node.js

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  validate:
    name: Validate project files

    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
