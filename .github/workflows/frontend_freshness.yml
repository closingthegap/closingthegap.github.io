name: Ensure website is up to date

on:
  push:
    branches:
      - frontend
  schedule:
    - cron: "9 6 * * 1"
  workflow_dispatch:

jobs:
  test:
    name: Verify data freshness

    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          ref: frontend

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run test
        run: node --test scripts/date_test.ts
